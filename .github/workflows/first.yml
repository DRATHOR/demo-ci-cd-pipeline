name: ESLint Check

on:
  push:
    branches: ['main', 'master', 'dev', 'qa', '**']
  pull_request:
    branches: ['main', 'master', 'dev', '**']

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
